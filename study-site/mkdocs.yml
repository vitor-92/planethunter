  - "How to study": how-to-study.md
  - "Basic level":
      - basic/index.md
      - "B1. Sky, stars and planets": basic/b1-sky-stars-planets.md
      - "B2. The transit method": basic/b2-transit-method.md
      - "B3. The TESS telescope": basic/b3-tess-telescope.md
      - "B4. Why almost every signal is false": basic/b4-false-positives.md
      - "B5. Practice with human eyes": basic/b5-human-eye-practice.md
      - "Self-assessment": basic/assessment.md
  - "Intermediate level":
