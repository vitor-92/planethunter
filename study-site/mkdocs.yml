      - "M1. Statistics for signals": intermediate/m1-statistics-for-signals.md
      - "M2. Transit physics": intermediate/m2-transit-physics.md
      - "M3. Periodograms": intermediate/m3-periodograms.md
      - "M4. TESS data in Python": intermediate/m4-tess-data-in-python.md
      - "M5. Vetting in practice": intermediate/m5-vetting-in-practice.md
      - "Self-assessment": intermediate/assessment.md
  - "Advanced level":
      - advanced/index.md
      - "A1. Detection algorithms": advanced/a1-detection-algorithms.md
      - "A2. How missions do vetting": advanced/a2-mission-vetting.md
      - "A3. False positive probability": advanced/a3-false-positive-probability.md
      - "A4. Machine learning": advanced/a4-machine-learning.md
      - "A5. Measuring the system": advanced/a5-measuring-the-system.md
      - "A6. From candidate to community": advanced/a6-from-candidate-to-community.md
      - "Self-assessment": advanced/assessment.md
  - "Programming track":
      - programming/index.md
      - "P1. Python basics": programming/p1-python-basics.md
      - "P2. NumPy, pandas and Matplotlib": programming/p2-numpy-pandas-matplotlib.md
      - "P3. Lightkurve in practice": programming/p3-lightkurve-in-practice.md
  - "Lab":
      - "Transit simulator": lab/transit-simulator.md
      - "Using PlanetHunter": lab/using-planethunter.md
  - "Glossary": glossary.md
