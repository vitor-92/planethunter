[project]
name = "planethunter"
version = "1.0.0"
description = "Search for exoplanet candidates in TESS data with vetting, crossmatch against catalogs and alerts."
readme = "README.md"
license = "MIT"
license-files = ["LICENSE"]
requires-python = ">=3.12,<3.13"
dependencies = [
    "numpy>=1.26",
    "pandas>=2.2",
    "pyarrow>=16",
    "duckdb>=1.0",
    "astropy>=6.0",
    "astroquery>=0.4.7",
    "lightkurve>=2.4",
    "wotan>=1.10",
    "transitleastsquares>=1.32",
    "typer>=0.12",
    "pydantic>=2.7",
    "pyyaml>=6.0",
    "batman-package>=2.5",
]

[project.optional-dependencies]
# GPU search pre-filter (NVIDIA/CUDA). Install with: uv sync --extra gpu
gpu = ["torch>=2.5"]

[project.scripts]
planethunter = "planethunter.cli:app"

[dependency-groups]
dev = [
    "pytest>=8",
    "ruff>=0.5",
]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/planethunter"]

[tool.ruff]
line-length = 100
target-version = "py312"
extend-exclude = [".claude", "docs"]

[tool.ruff.lint]
select = ["E", "F", "W", "I", "UP", "B", "SIM", "NPY"]

[tool.ruff.lint.per-file-ignores]
"src/planethunter/alerts/dossier.py" = ["E501"]  # template HTML

[tool.pytest.ini_options]
testpaths = ["tests"]
markers = [
    "network: needs internet access (MAST, Exoplanet Archive). Run with -m network.",
    "slow: takes more than 30 s.",
]
addopts = "-m 'not network and not slow'"

[tool.uv.sources]
torch = [{ index = "pytorch-cu126", extra = "gpu" }]

[[tool.uv.index]]
name = "pytorch-cu126"
url = "https://download.pytorch.org/whl/cu126"
explicit = true
